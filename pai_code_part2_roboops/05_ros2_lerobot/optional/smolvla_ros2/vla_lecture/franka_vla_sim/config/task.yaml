# 演習全体で共有する設定．
# データ収集（テレオペ）・変換・推論・評価で同じ値を使うことが重要．
# 特に fps / action の定義 / カメラ名 がずれると，学習した方策が正しく動かない．

# 制御周期 = データセットのfps [Hz]
fps: 10

# 言語指示（SmolVLAに与えるタスク文）
task: "Push the red cube into the green goal area."

# ロボット
arm_joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
hand_joints: [fr3_finger_joint1, fr3_finger_joint2]
home_q: [0.0, -0.3, 0.0, -2.2, 0.0, 1.9, 0.785]   # 初期姿勢（手先が下向き）
hand_closed: [0.0, 0.0]                            # 押す作業なので指は閉じたまま
max_joint_step: 0.15                               # 1周期あたりの関節角変化の上限 [rad]（安全のため）

# トピック
topics:
  joint_states: /joint_states
  arm_command: /arm_controller/commands            # = action（関節角の目標値, 7次元）
  hand_command: /hand_controller/commands
  camera_front: /cameras/front/image
  camera_wrist: /cameras/wrist/image
  cube_pose: /model/red_cube/pose

# Gazeboのワールド
world_name: vla_world
cube_name: red_cube
cube_z: 0.025                                      # キューブ中心の高さ（一辺5cm）
cube_spawn_range:                                  # データ収集時のキューブ初期位置の範囲 [m]
  x: [0.45, 0.60]
  y: [-0.20, -0.08]
goal_center: [0.52, 0.15]                          # ゴール（緑の円）の中心 [m]
goal_radius: 0.07                                  # 成功判定：キューブ中心がこの半径内

# テレオペ（手先空間）
teleop:
  step: 0.01                                       # 1回のキー入力での目標位置の移動量 [m]
  max_speed: 0.15                                  # 手先の最大速度 [m/s]
  workspace:                                       # 手先の可動範囲 [m]
    x: [0.25, 0.75]
    y: [-0.40, 0.40]
    z: [0.03, 0.45]
  bag_root: ~/dataset/rosbags/franka_push           # rosbagの保存先（エピソードごとにep_000, ep_001, ...）

# 評価
evaluation:
  timeout: 40.0                                    # 1試行の制限時間 [s]（シミュレーション時間）
  # 評価用のキューブ初期位置（全員同じ条件で比較するため固定）
  cube_positions:
    - [0.50, -0.12]
    - [0.55, -0.15]
    - [0.47, -0.18]
    - [0.58, -0.10]
    - [0.52, -0.09]
    - [0.46, -0.10]
    - [0.57, -0.19]
    - [0.53, -0.16]
    - [0.49, -0.14]
    - [0.59, -0.13]
